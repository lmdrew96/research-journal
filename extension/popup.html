<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">Research Journal Clipper</div>

  <div id="setup" class="message" style="display: none;">
    <p>Connect the clipper to your Research Journal.</p>
    <ol class="setup-steps">
      <li>Open ThreadNotes &rarr; Settings &rarr; API Keys</li>
      <li>Generate a key and copy it (it is shown once)</li>
      <li>Paste it below</li>
    </ol>
    <label class="label" for="api-key-input">API key</label>
    <input id="api-key-input" type="password" placeholder="rj_..." autocomplete="off" />
    <label class="label" for="api-base-input">Server</label>
    <input id="api-base-input" type="text" autocomplete="off" />
    <button id="setup-save" class="save-btn">Connect</button>
    <div id="setup-error" class="status error" style="display: none;"></div>
  </div>

  <div id="no-capture" class="message" style="display: none;">
    Highlight text on any page, then right-click and select
    "Save to Research Journal".
  </div>

  <div id="capture-form" style="display: none;">
    <div id="project-name" class="project-name" style="display: none;"></div>
    <div class="section">
      <label class="label">Excerpt</label>
      <div id="quote" class="quote"></div>
    </div>

    <div class="section">
      <label class="label" for="comment">Comment (optional)</label>
      <textarea id="comment" placeholder="Why is this relevant?"></textarea>
    </div>

    <div class="section">
      <label class="label">Save to</label>
      <div class="toggle-row">
        <button id="btn-new" class="toggle active">New article</button>
        <button id="btn-existing" class="toggle">Existing article</button>
      </div>
    </div>

    <div id="new-article-info" class="section">
      <div class="page-info">
        <div class="page-title" id="page-title"></div>
        <div class="page-url" id="page-url"></div>
      </div>
    </div>

    <div id="existing-article-picker" class="section" style="display: none;">
      <select id="article-select">
        <option value="">Loading articles...</option>
      </select>
    </div>

    <button id="save-btn" class="save-btn">Save Excerpt</button>
    <div id="status" class="status"></div>
    <div id="queue-banner" class="status success" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
